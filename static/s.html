<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>История изменений</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .history-container { padding: 20px; }
        
        .filters {
            display: flex;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        
        .filter-input {
            padding: 8px 12px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
        }
        
        .event-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .event-item {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
        }
        
        .event-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }
        
        .event-machine {
            font-weight: 600;
            color: var(--primary);
        }
        
        .event-date {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        .event-type {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
        }
        
        .event-type.create { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .event-type.update { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        
        .change-item {
            display: flex;
            padding: 8px;
            margin: 5px 0;
            background: rgba(15, 23, 42, 0.4);
            border-radius: 4px;
            font-size: 0.9rem;
        }
        
        .change-field {
            min-width: 150px;
            color: var(--text-secondary);
        }
        
        .old-value {
            color: #ef4444;
            text-decoration: line-through;
            margin-right: 10px;
        }
        
        .new-value {
            color: #10b981;
            font-weight: 500;
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
        
        .page-btn {
            padding: 5px 10px;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-primary);
            cursor: pointer;
        }
        
        .page-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-container">
            <header>
                <h1>История изменений</h1>
                <p class="subtitle">Хронология работы со станками</p>
            </header>

            <div class="menu">
                <a href="/" class="back-button">← На главную</a>
                <a href="/add-draft" class="back-button">+ Добавить</a>
            </div>

            <div class="history-container">
                <!-- Фильтры -->
                <div class="filters">
                    <input type="date" id="dateFrom" class="filter-input" placeholder="С">
                    <input type="date" id="dateTo" class="filter-input" placeholder="По">
                    <button id="refreshBtn" class="back-button">🔄 Обновить</button>
                </div>

                <!-- Список событий -->
                <div id="eventList" class="event-list">
                    <div class="loading">Загрузка истории...</div>
                </div>

                <!-- Пагинация -->
                <div id="pagination" class="pagination"></div>
            </div>

            <footer>
                <p>Система учета оборудования станков</p>
            </footer>
        </div>
    </div>

    <script>
        let currentPage = 1;
        let totalPages = 1;

        document.addEventListener('DOMContentLoaded', () => {
            loadHistory();
            
            document.getElementById('refreshBtn').addEventListener('click', () => {
                currentPage = 1;
                loadHistory();
            });
            
            document.getElementById('dateFrom').addEventListener('change', () => {
                currentPage = 1;
                loadHistory();
            });
            
            document.getElementById('dateTo').addEventListener('change', () => {
                currentPage = 1;
                loadHistory();
            });
        });

        async function loadHistory() {
            const dateFrom = document.getElementById('dateFrom').value;
            const dateTo = document.getElementById('dateTo').value;
            
            let url = `/api/history?page=${currentPage}`;
            if (dateFrom) url += `&dateFrom=${dateFrom}`;
            if (dateTo) url += `&dateTo=${dateTo}`;
            
            try {
                const response = await fetch(url);
                const result = await response.json();
                
                if (result.success) {
                    displayEvents(result.events);
                    setupPagination(result.page, result.total_pages);
                } else {
                    showError(result.error);
                }
            } catch (error) {
                showError(error.message);
            }
        }

        function displayEvents(events) {
            const container = document.getElementById('eventList');
            
            if (!events || events.length === 0) {
                container.innerHTML = '<div class="loading">Нет событий за выбранный период</div>';
                return;
            }
            
            container.innerHTML = events.map(event => `
                <div class="event-item">
                    <div class="event-header">
                        <span class="event-machine">${event.machine_name}</span>
                        <span class="event-date">📅 ${new Date(event.created_at).toLocaleString('ru-RU')}</span>
                    </div>
                    <div>
                        <span class="event-type ${event.event_type}">
                            ${event.event_type === 'create' ? '✅ Создание' : '✏️ Изменение'}
                        </span>
                    </div>
                    ${event.changes ? `
                        <div style="margin-top: 10px;">
                            ${event.changes.map(change => `
                                <div class="change-item">
                                    <span class="change-field">${change.field}:</span>
                                    <span class="old-value">${change.old_value}</span>
                                    <span>→</span>
                                    <span class="new-value">${change.new_value}</span>
                                </div>
                            `).join('')}
                        </div>
                    ` : ''}
                    ${event.initial_data ? `
                        <div style="margin-top: 10px; color: var(--text-secondary);">
                            📋 Создан: ${event.initial_data.machineType || ''} для ${event.initial_data.customer || ''}
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        function setupPagination(page, total) {
            totalPages = total;
            const container = document.getElementById('pagination');
            
            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }
            
            let html = '';
            
            if (page > 1) {
                html += `<button class="page-btn" onclick="goToPage(${page - 1})">←</button>`;
            }
            
            html += `<span style="color: var(--text-secondary); margin: 0 10px;">${page} / ${totalPages}</span>`;
            
            if (page < totalPages) {
                html += `<button class="page-btn" onclick="goToPage(${page + 1})">→</button>`;
            }
            
            container.innerHTML = html;
        }

        function goToPage(page) {
            currentPage = page;
            loadHistory();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showError(message) {
            document.getElementById('eventList').innerHTML = `
                <div class="loading" style="color: #ef4444;">
                    ❌ Ошибка: ${message}
                </div>
            `;
        }
    </script>
</body>
</html>
