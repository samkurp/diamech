<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админка - Управление прошивками</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Уменьшаем масштаб всех элементов */
        .admin-container {
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
            font-size: 0.9rem;
        }
        
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .admin-header h1 {
            font-size: 1.5rem;
            margin: 0;
        }
        
        .admin-tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            overflow-x: auto;
        }
        
        .tab-btn {
            padding: 6px 12px;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 6px;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 500;
            white-space: nowrap;
            font-size: 0.85rem;
        }
        
        .tab-btn.active {
            background: var(--primary);
            border-color: var(--primary);
        }
        
        .tab-btn:hover {
            border-color: var(--primary);
        }
        
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .item-card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            transition: var(--transition);
        }
        
        .item-card:hover {
            border-color: var(--primary);
            background: rgba(30, 41, 59, 0.7);
        }
        
        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        
        .item-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .item-badge {
            background: var(--primary);
            color: white;
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 0.65rem;
        }
        
        .item-date {
            color: var(--text-secondary);
            font-size: 0.75rem;
            margin: 4px 0;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .item-file {
            color: var(--primary-light);
            font-size: 0.7rem;
            word-break: break-all;
            margin: 8px 0;
            padding: 6px;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 4px;
            font-family: monospace;
        }
        
        .item-description {
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin: 6px 0;
        }
        
        .item-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        
        .edit-btn, .delete-btn {
            flex: 1;
            padding: 6px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            transition: var(--transition);
            font-size: 0.8rem;
        }
        
        .edit-btn {
            background: var(--primary);
            color: white;
        }
        
        .edit-btn:hover {
            background: var(--primary-dark);
        }
        
        .delete-btn {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        
        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.3);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            padding: 20px;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .modal-content h3 {
            margin-bottom: 15px;
            color: var(--text-primary);
            font-size: 1.2rem;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.8rem;
        }
        
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.85rem;
        }
        
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: var(--primary);
            outline: none;
        }
        
        .form-group textarea {
            min-height: 60px;
            resize: vertical;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        
        .save-btn {
            flex: 1;
            padding: 10px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        .save-btn:hover {
            background: var(--primary-dark);
        }
        
        .cancel-btn {
            flex: 1;
            padding: 10px;
            background: rgba(148, 163, 184, 0.2);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
        }
        
        .cancel-btn:hover {
            background: rgba(148, 163, 184, 0.3);
        }
        
        .add-btn {
            padding: 8px 16px;
            background: var(--success);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
        }
        
        .add-btn:hover {
            background: #0d9488;
        }
        
        .view-btn {
            padding: 8px 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
        }
        
        .section-info {
            background: rgba(59, 130, 246, 0.1);
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            border-left: 3px solid var(--primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        .empty-state {
            grid-column: 1/-1;
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }
        
        .empty-state .icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
            opacity: 0.5;
        }
        
        .empty-state h3 {
            font-size: 1.1rem;
            margin-bottom: 8px;
        }
        
        .badge-preview {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 0.65rem;
            background: var(--primary);
            color: white;
        }
        
        @media (max-width: 768px) {
            .admin-container {
                padding: 10px;
            }
            
            .admin-header {
                flex-direction: column;
                align-items: stretch;
            }
            
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .items-grid {
                grid-template-columns: 1fr;
            }
            
            .admin-header h1 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-container">
            <div class="admin-container">
                <div class="admin-header">
                    <h1>📋 Управление прошивками</h1>
                    <div class="d-flex gap-8">
                        <a href="/static/updates_utilites.html" class="view-btn" target="_blank">
                            👁️ Просмотр
                        </a>
                        <button class="add-btn" onclick="openAddModal()">
                            ➕ Добавить
                        </button>
                    </div>
                </div>
                
                <div class="admin-tabs" id="tabs">
                    <button class="tab-btn active" data-tab="sapphire">💎 САПФИР-3</button>
                    <button class="tab-btn" data-tab="yashma">💎 ЯШМА</button>
                    <button class="tab-btn" data-tab="stsh">🔧 СТШ</button>
                    <button class="tab-btn" data-tab="external_utils">🔌 Стороннее ПО</button>
                    <button class="tab-btn" data-tab="internal_utils">⚡ Внутренние</button>
                    <button class="tab-btn" data-tab="docs">📚 Документация</button>
                </div>
                
                <div class="section-info" id="sectionInfo">
                    <span>Загрузка...</span>
                </div>
                
                <div id="itemsContainer" class="items-grid">
                    <div class="loading">Загрузка данных...</div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Модальное окно -->
    <div class="modal" id="itemModal">
        <div class="modal-content">
            <h3 id="modalTitle">Добавить элемент</h3>
            
            <div class="form-group">
                <label>Раздел</label>
                <select id="itemSection">
                    <option value="sapphire">САПФИР-3</option>
                    <option value="yashma">ЯШМА</option>
                    <option value="stsh">СТШ</option>
                    <option value="external_utils">Стороннее ПО</option>
                    <option value="internal_utils">Внутренние утилиты</option>
                    <option value="docs">Документация</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Название <span class="text-danger">*</span></label>
                <input type="text" id="itemTitle" placeholder="Например: Прошивка v2.38">
            </div>
            
            <div class="form-group">
                <label>Описание</label>
                <textarea id="itemDescription" placeholder="Краткое описание"></textarea>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Дата</label>
                    <input type="text" id="itemDate" placeholder="ДД.ММ.ГГГГ">
                </div>
                
                <div class="form-group">
                    <label>Тип</label>
                    <input type="text" id="itemBadge" placeholder="ZIP" value="ZIP">
                </div>
            </div>
            
            <div class="form-group">
                <label>Путь к файлу <span class="text-danger">*</span></label>
                <input type="text" id="itemFile" placeholder="/static/updates/file.zip">
            </div>
            
            <div class="modal-actions">
                <button class="save-btn" onclick="saveItem()">Сохранить</button>
                <button class="cancel-btn" onclick="closeModal()">Отмена</button>
            </div>
        </div>
    </div>
    
    <script>
        let currentData = null;
        let currentTab = 'sapphire';
        let editingId = null;
        
        async function loadData() {
            try {
                const response = await fetch('/api/updates');
                const result = await response.json();
                
                if (result.success) {
                    currentData = result.updates;
                    document.querySelector('.section-info span').textContent = 
                        `Последнее обновление: ${result.last_update || 'не указано'}`;
                    renderItems();
                } else {
                    showError('Ошибка загрузки данных');
                }
            } catch (error) {
                console.error('Ошибка загрузки:', error);
                document.getElementById('itemsContainer').innerHTML = `
                    <div class="empty-state">
                        <div class="icon">⚠️</div>
                        <h3>Ошибка загрузки данных</h3>
                        <p>Проверьте подключение к серверу</p>
                    </div>
                `;
            }
        }
        
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentTab = this.dataset.tab;
                renderItems();
                updateSectionInfo();
            });
        });
        
        function updateSectionInfo() {
            const titles = {
                sapphire: 'САПФИР-3',
                yashma: 'ЯШМА',
                stsh: 'СТШ',
                external_utils: 'Стороннее ПО',
                internal_utils: 'Внутренние утилиты',
                docs: 'Документация'
            };
            
            const count = currentData?.[currentTab]?.length || 0;
            document.querySelector('.section-info').innerHTML = `
                <span><strong>${titles[currentTab]}</strong> — ${count} записей</span>
                ${count > 0 ? '<span class="badge-preview">' + count + '</span>' : ''}
            `;
        }
        
        function renderItems() {
            const container = document.getElementById('itemsContainer');
            const items = currentData?.[currentTab] || [];
            
            if (items.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📂</div>
                        <h3>В этом разделе пока ничего нет</h3>
                        <p>Нажмите "Добавить" чтобы создать запись</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = items.map(item => `
                <div class="item-card">
                    <div class="item-header">
                        <span class="item-title">${escapeHtml(item.title)}</span>
                        <span class="item-badge">${item.badge || 'ZIP'}</span>
                    </div>
                    
                    ${item.description ? `
                        <div class="item-description">${escapeHtml(item.description)}</div>
                    ` : ''}
                    
                    ${item.date ? `
                        <div class="item-date">📅 ${item.date}</div>
                    ` : ''}
                    
                    <div class="item-file">📁 ${escapeHtml(item.file)}</div>
                    
                    <div class="item-actions">
                        <button class="edit-btn" onclick="editItem(${item.id})">✏️ Ред.</button>
                        <button class="delete-btn" onclick="deleteItem(${item.id})">🗑️ Уд.</button>
                    </div>
                </div>
            `).join('');
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function openAddModal() {
            editingId = null;
            document.getElementById('modalTitle').textContent = 'Добавить элемент';
            document.getElementById('itemSection').value = currentTab;
            document.getElementById('itemTitle').value = '';
            document.getElementById('itemDescription').value = '';
            document.getElementById('itemDate').value = '';
            document.getElementById('itemFile').value = '';
            document.getElementById('itemBadge').value = 'ZIP';
            document.getElementById('itemModal').classList.add('active');
        }
        
        function editItem(id) {
            const item = currentData[currentTab].find(i => i.id === id);
            if (!item) return;
            
            editingId = id;
            document.getElementById('modalTitle').textContent = 'Редактировать';
            document.getElementById('itemSection').value = currentTab;
            document.getElementById('itemTitle').value = item.title || '';
            document.getElementById('itemDescription').value = item.description || '';
            document.getElementById('itemDate').value = item.date || '';
            document.getElementById('itemFile').value = item.file || '';
            document.getElementById('itemBadge').value = item.badge || 'ZIP';
            document.getElementById('itemModal').classList.add('active');
        }
        
        async function saveItem() {
            const section = document.getElementById('itemSection').value;
            const title = document.getElementById('itemTitle').value.trim();
            const description = document.getElementById('itemDescription').value.trim();
            const date = document.getElementById('itemDate').value.trim();
            const file = document.getElementById('itemFile').value.trim();
            const badge = document.getElementById('itemBadge').value.trim() || 'ZIP';
            
            if (!title || !file) {
                alert('Заполните название и путь к файлу');
                return;
            }
            
            const data = { section, title, description, date, file, badge };
            
            try {
                let response;
                if (editingId) {
                    response = await fetch(`/api/updates/${editingId}`, {
                        method: 'PUT',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(data)
                    });
                } else {
                    response = await fetch('/api/updates', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(data)
                    });
                }
                
                const result = await response.json();
                
                if (result.success) {
                    await loadData();
                    closeModal();
                } else {
                    alert('Ошибка: ' + (result.error || 'Неизвестная ошибка'));
                }
            } catch (error) {
                console.error('Ошибка:', error);
                alert('Ошибка соединения с сервером');
            }
        }
        
        async function deleteItem(id) {
            if (!confirm('Удалить?')) return;
            
            try {
                const response = await fetch(`/api/updates/${id}`, {
                    method: 'DELETE'
                });
                
                const result = await response.json();
                
                if (result.success) {
                    await loadData();
                } else {
                    alert('Ошибка: ' + (result.error || 'Неизвестная ошибка'));
                }
            } catch (error) {
                console.error('Ошибка:', error);
                alert('Ошибка соединения с сервером');
            }
        }
        
        function closeModal() {
            document.getElementById('itemModal').classList.remove('active');
        }
        
        loadData();
    </script>
</body>
</html>
