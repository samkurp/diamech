<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Станки в работе</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><span class="icon">📋</span>Станки в работе</h1>
            <p class="subtitle">Управление сохраненными черновиками маршрутных листов</p>
        </header>

        <div class="drafts-container">
            <div class="drafts-header">
                <a href="/" class="back-button">
                    Добавить Станок
                </a>
                <a href="/" class="back-button">
                    Параметры частотников
                </a>
                <a href="/" class="back-button">
                    Пневматика
                </a>
            </div>

            <div id="draftsList" class="drafts-list">
                <div class="empty-state">
                    <div class="icon">📝</div>
                    <h3>Станков в работе нет</h3>
                    <p>Сохраните первый черновик из формы ввода данных</p>
                </div>
            </div>

            <div id="statusMessage" class="status-message" style="display: none;"></div>
        </div>

        <footer>
            <p>Система учета оборудования станков © 2025</p>
        </footer>
    </div>
<script src="/static/drafts.js"></script>
</body>
</html>
