<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админка - Управление прошивками</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="main-container">
            <div class="admin-container">
                <div class="admin-header">
                    <h1>📋 Управление прошивками</h1>
                    <div class="d-flex gap-8">
                        <a href="/static/updates_utilites.html" class="view-btn" target="_blank">👁️ Просмотр</a>
                        <button class="add-btn" onclick="openAddModal()">➕ Добавить</button>
                    </div>
                </div>

                <div class="admin-tabs" id="tabs">
                    <button class="tab-btn active" data-tab="sapphire">💎 САПФИР-3</button>
                    <button class="tab-btn" data-tab="yashma">💎 ЯШМА</button>
                    <button class="tab-btn" data-tab="stsh">🔧 СТШ</button>
                    <button class="tab-btn" data-tab="external_utils">🔌 Стороннее ПО</button>
                    <button class="tab-btn" data-tab="internal_utils">⚡ Внутренние</button>
                    <button class="tab-btn" data-tab="docs">📚 Документация</button>
                </div>

                <div class="section-info" id="sectionInfo">Загрузка...</div>
                <div id="itemsContainer" class="items-grid">
                    <div class="loading">Загрузка данных...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно -->
    <div class="modal" id="itemModal">
        <div class="modal-content">
            <h3 id="modalTitle">Добавить элемент</h3>
            <div class="form-group">
                <label>Раздел</label>
                <select id="itemSection">
                    <option value="sapphire">САПФИР-3</option>
                    <option value="yashma">ЯШМА</option>
                    <option value="stsh">СТШ</option>
                    <option value="external_utils">Стороннее ПО</option>
                    <option value="internal_utils">Внутренние утилиты</option>
                    <option value="docs">Документация</option>
                </select>
            </div>
            <div class="form-group">
                <label>Название <span class="text-danger">*</span></label>
                <input type="text" id="itemTitle" placeholder="Например: Прошивка v2.38">
            </div>
            <div class="form-group">
                <label>Описание</label>
                <textarea id="itemDescription" placeholder="Краткое описание"></textarea>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Дата</label>
                    <input type="text" id="itemDate" placeholder="ДД.ММ.ГГГГ">
                </div>
                <div class="form-group">
                    <label>Тип</label>
                    <input type="text" id="itemBadge" placeholder="ZIP" value="ZIP">
                </div>
            </div>
            <div class="form-group">
                <label>Путь к файлу <span class="text-danger">*</span></label>
                <input type="text" id="itemFile" placeholder="/static/updates/file.zip">
            </div>
            <div class="modal-actions">
                <button class="save-btn" onclick="saveItem()">Сохранить</button>
                <button class="cancel-btn" onclick="closeModal()">Отмена</button>
            </div>
        </div>
    </div>

    <script src="/static/admin_updates.js"></script>
</body>
</html>
