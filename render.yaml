services:
  - type: web
    name: diamech
    runtime: python
    plan: free
    buildCommand: |
      unset POETRY_VERSION
      unset POETRY_HOME
      pip install --upgrade pip
      pip install --no-cache-dir -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DISABLE_POETRY
        value: "true"
      - key: PYTHON_VERSION
        value: 3.11.0
      # НЕ ПРОПИСЫВАЙТЕ SUPABASE ЗДЕСЬ! Только через Dashboard!
